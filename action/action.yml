# Euthynos composite action (Slice 2).
#
# This file lives in action/, one level BELOW the action repo root that
# holds package.json and src/. Every run step therefore works inside
# "${{ github.action_path }}/.." (passed to bash via env, never
# interpolated into the script body).
#
# The SCANNED tree is the consumer's checkout: ${{ github.workspace }}/<path>.
# Exit code is always 0 by design: observe, don't block.

name: Euthynos Architecture Scan
description: >-
  Deterministic architecture metrics for your repository (module depth,
  seam health, locality, leverage, contamination) computed from ASTs, the
  import graph, and git history, then posted as a sticky pull request
  comment. Observe, don't block - the scan never fails your build.

branding:
  icon: activity
  color: purple

inputs:
  path:
    description: Path inside the consumer workspace to scan, relative to the repository root.
    required: false
    default: '.'
  months:
    description: Git history window in months used by the locality metric.
    required: false
    default: '6'
  comment:
    description: Set to 'false' to skip posting the sticky PR comment.
    required: false
    default: 'true'
  github-token:
    description: Token used to list, create, and update PR comments (needs pull-requests write permission).
    required: false
    default: '${{ github.token }}'

runs:
  using: composite
  steps:
    - name: Set up Node 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Run Euthynos scan
      shell: bash
      env:
        CH_ACTION_PATH: ${{ github.action_path }}
        CH_SCAN_PATH: ${{ inputs.path }}
        CH_MONTHS: ${{ inputs.months }}
      run: |
        set -euo pipefail

        # Install and run the CLI from the action repo root (one level
        # above action/). tsx is a devDependency, so plain `npm ci` is
        # required - do not add --omit=dev.
        cd "${CH_ACTION_PATH}/.."
        npm ci --no-audit --no-fund

        npx tsx src/cli.ts scan "${GITHUB_WORKSPACE}/${CH_SCAN_PATH}" \
          --md "${RUNNER_TEMP}/contexthub.md" \
          --json "${RUNNER_TEMP}/contexthub.json" \
          --months "${CH_MONTHS}" \
          --quiet

    - name: Prepend changed modules to the report
      if: github.event_name == 'pull_request'
      shell: bash
      env:
        CH_BASE_REF: ${{ github.base_ref }}
        CH_SCAN_PATH: ${{ inputs.path }}
      run: |
        set -euo pipefail

        # Push events (or anything without a base ref) have nothing to
        # diff against: skip gracefully.
        if [ -z "${CH_BASE_REF}" ]; then
          echo "No base ref on this event - skipping changed-module summary."
          exit 0
        fi

        repo_dir="${GITHUB_WORKSPACE}/${CH_SCAN_PATH}"
        md_file="${RUNNER_TEMP}/contexthub.md"

        if [ ! -f "${md_file}" ]; then
          echo "No report found at ${md_file} - skipping changed-module summary."
          exit 0
        fi

        # Fetch the base branch tip. The explicit refspec guarantees
        # refs/remotes/origin/<base> exists even when actions/checkout
        # configured a narrow fetch refspec.
        git -C "${repo_dir}" fetch --depth=1 origin \
          "+refs/heads/${CH_BASE_REF}:refs/remotes/origin/${CH_BASE_REF}"

        # Three-dot diff needs a merge base, which shallow clones often
        # lack. Fall back to a two-dot tree diff: exact for the PR merge
        # commit that actions/checkout checks out by default.
        if ! changed_files=$(git -C "${repo_dir}" diff --name-only \
            "origin/${CH_BASE_REF}...HEAD" 2>/dev/null); then
          echo "No merge base in shallow history - using two-dot diff."
          changed_files=$(git -C "${repo_dir}" diff --name-only \
            "origin/${CH_BASE_REF}" HEAD)
        fi

        if [ -z "${changed_files}" ]; then
          modules_line="_(no changed files detected)_"
        else
          # Top-level directory of each changed path = module; bare
          # root-level files map to "(root)", matching the CLI's naming.
          modules_line=$(printf '%s\n' "${changed_files}" \
            | awk -F/ 'NF > 1 { print $1 } NF == 1 { print "(root)" }' \
            | sort -u \
            | awk 'NR > 1 { printf ", " } { printf "`%s`", $0 } END { print "" }')
        fi

        {
          echo "### Modules touched in this PR"
          echo
          echo "${modules_line}"
          echo
          cat "${md_file}"
        } > "${md_file}.tmp"
        mv "${md_file}.tmp" "${md_file}"

        echo "Modules touched: ${modules_line}"

    - name: Post sticky PR comment
      if: inputs.comment == 'true' && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          // Legacy marker, kept on purpose: it identifies sticky comments
          // already posted on open PRs. Renaming it would orphan those and
          // post a duplicate alongside each one.
          const marker = '<!-- contexthub-report -->';
          const reportPath = process.env.RUNNER_TEMP + '/contexthub.md';

          let report;
          try {
            report = fs.readFileSync(reportPath, 'utf8');
          } catch (err) {
            core.warning('Euthynos report missing at ' + reportPath + ': ' + err.message);
            return;
          }

          let body = marker + '\n' + report;
          const LIMIT = 65000; // GitHub comment hard limit is 65536 chars
          if (body.length > LIMIT) {
            body = body.slice(0, LIMIT) + '\n\n_(truncated by Euthynos)_';
          }

          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;

          try {
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
              core.info('Updated sticky Euthynos comment #' + existing.id);
            } else {
              const created = await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
              core.info('Created sticky Euthynos comment #' + created.data.id);
            }
          } catch (err) {
            // Fork PRs get a read-only GITHUB_TOKEN. Observe, don't block:
            // warn instead of failing the job.
            core.warning('Could not post Euthynos comment (read-only token on fork PRs?): ' + err.message);
          }
